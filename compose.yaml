services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auraseal
      POSTGRES_PASSWORD: local_admin_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - auraseal_db:/var/lib/postgresql/data
      - ./db/local-init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auraseal"]
      interval: 2s
      timeout: 5s
      retries: 15
volumes:
  auraseal_db:
