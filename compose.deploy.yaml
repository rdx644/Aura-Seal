name: auraseal-deploy

x-application: &application
  build: .
  image: auraseal:dev
  environment: &runtime
    DATABASE_URL: postgresql://auraseal:${AURASEAL_DB_PASSWORD:?Set a URL-safe database password}@db:5432/auraseal
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set the canonical HTTPS origin}
    NEXT_TELEMETRY_DISABLED: "1"

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: auraseal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a PostgreSQL admin password}
      AURASEAL_DB_PASSWORD: ${AURASEAL_DB_PASSWORD:?Set a URL-safe database password}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./db/deploy-init.sh:/docker-entrypoint-initdb.d/001-auraseal.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-d", "auraseal"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *application
    command: ["npm", "run", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *application
    environment:
      <<: *runtime
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      TRUST_PROXY_IP_HEADER: ${TRUST_PROXY_IP_HEADER:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${AURASEAL_WEB_PORT:-3100}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  worker:
    <<: *application
    command: ["./node_modules/.bin/tsx", "workers/render/index.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 4m

volumes:
  postgres:
